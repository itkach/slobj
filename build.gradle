plugins {
    id 'java-library'
}

def getVersionName = {
    return "git -C ${projectDir} describe --tags".execute().text.trim()
}

version = getVersionName()

// sourceCompatibility/targetCompatibility only restrict language syntax; they
// don't stop code from calling APIs added after the declared version, since
// javac still links against whichever JDK is actually running it. `release`
// uses javac's --release flag, which swaps in that version's real API
// surface, so code that isn't actually usable on minSdkVersion 19 fails to
// compile instead of only failing at runtime on old devices.
tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.testng:testng:6.9.6'
    implementation 'org.tukaani:xz:1.9'
    api 'com.ibm.icu:icu4j:68.1'
 }

test {
    useTestNG {

    }
}
